spring:
    application:
        name: spring-ddd-template

    # H2 Database (development)
    datasource:
        url: jdbc:h2:mem:ddddb
        driver-class-name: org.h2.Driver
        username: sa
        password:

    # JPA Configuration
    jpa:
        hibernate:
            ddl-auto: create-drop
        open-in-view: false
        show-sql: true
        properties:
            hibernate:
                format_sql: true

    # H2 Console (development only)
    h2:
        console:
            enabled: true
            path: /h2-console

    # Mail Configuration (customize for production)
    mail:
        host: localhost
        port: 1025
        username:
        password:
        properties:
            mail:
                smtp:
                    auth: false
                    starttls:
                        enable: false

    # Security - disable for H2 console access during development
    security:
        filter:
            order: 5

# Springdoc / Swagger
springdoc:
    api-docs:
        path: /api-docs
    swagger-ui:
        path: /swagger-ui.html
        tags-sorter: alpha
        operations-sorter: alpha

# Logging
logging:
    level:
        io.github.springdddtemplate: DEBUG
        org.hibernate.SQL: DEBUG
        org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Application custom properties
app:
    mail:
        from: noreply@example.com
